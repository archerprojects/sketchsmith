# SketchSmith — SketchSmith keymap preset
# Version 1.0.0 (initial release) — Thursday 12 November 2026
#
# The default. Ctrl switches on (and selects); Shift switches off; Alt moves
# and reshapes geometry; a single key makes or removes geometry, on its first
# letter where free. Space+letter and Tab+letter are hold chords (the letter
# pressed while Space or Tab is held): Space for the Tweak and Generate tools,
# Tab for measuring, guides, labels, sections and the Present tools. Space
# released alone is Select; Tab released alone switches Edit / Present. A lone
# Ctrl tap stays the drawing tools' own switch (copy, in Move and Rotate). Navigation is the mouse (middle drag
# orbits, Shift + middle drag pans, the wheel zooms); on a touchpad, Alt+O,
# Alt+P and Alt+Z pick the Orbit, Pan and Zoom tools. No command sits on a
# bare digit: digits are typed values.
#
# Built in and never changed: changing a key in Preferences → Keys copies
# this table into Custom (`keymap-custom.toml` in the config folder).

name = "SketchSmith"

[keys]
orbit_tool = "Alt+O"
pan_tool = "Alt+P"
zoom_tool = "Alt+Z"
zoom_extents = "Home"
perspective = "Alt+V"
